services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: titan
      POSTGRES_USER: titan
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a strong database password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U titan -d titan"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
  api:
    build: ../backend
    environment:
      TITAN_ENVIRONMENT: production
      TITAN_API_KEY: ${TITAN_API_KEY:?Set a strong API key}
      TITAN_DATABASE_URL: postgresql+asyncpg://titan:${POSTGRES_PASSWORD}@postgres:5432/titan
      TITAN_WORKSPACE_ROOT: /srv/titan/data/workspaces
      TITAN_REPORT_ROOT: /srv/titan/data/reports
      TITAN_TERMINAL_ENABLED: "false"
      TITAN_OPENAI_COMPATIBLE_BASE_URL: ${TITAN_OPENAI_COMPATIBLE_BASE_URL:-}
      TITAN_OPENAI_COMPATIBLE_API_KEY: ${TITAN_OPENAI_COMPATIBLE_API_KEY:-}
      TITAN_OPENAI_COMPATIBLE_MODEL: ${TITAN_OPENAI_COMPATIBLE_MODEL:-}
    ports:
      - "8000:8000"
    volumes:
      - titan_data:/srv/titan/data
    depends_on:
      postgres:
        condition: service_healthy
    command: ["/bin/sh", "-c", "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"]
    restart: unless-stopped
volumes:
  postgres_data:
  titan_data:
