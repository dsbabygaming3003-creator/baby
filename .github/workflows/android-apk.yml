name: android-apk
on:
  workflow_dispatch:
  push:
    paths:
      - "android/**"
      - ".github/workflows/android-apk.yml"
permissions:
  contents: read
jobs:
  assemble-debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"
      - name: Build debug APK
        working-directory: android
        shell: bash
        run: |
          set +e
          gradle :app:assembleDebug --stacktrace > build-output.log 2>&1
          code=$?
          cat build-output.log
          if [ "$code" -ne 0 ]; then
            grep -E '(^e:|What went wrong|Execution failed|Could not resolve|Could not determine|error:)' build-output.log | head -15 | while IFS= read -r line; do
              echo "::error::$line"
            done
          fi
          exit "$code"
      - name: Verify APK and record SHA-256
        working-directory: android
        run: |
          apk="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$apk"
          stat --printf='APK size: %s bytes\n' "$apk"
          sha256sum "$apk"
      - uses: actions/upload-artifact@v4
        with:
          name: titan-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
