name: android-apk
on:
  workflow_dispatch:
  push:
    paths:
      - "android/**"
      - ".github/workflows/android-apk.yml"
permissions:
  contents: write
jobs:
  assemble-debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"
      - name: Build debug APK
        working-directory: android
        shell: bash
        run: |
          set +e
          gradle :app:assembleDebug --stacktrace > build-output.log 2>&1
          code=$?
          cat build-output.log
          if [ "$code" -ne 0 ]; then
            grep -E '(^e:|What went wrong|Execution failed|Could not resolve|Could not determine|error:)' build-output.log | head -15 | while IFS= read -r line; do
              echo "::error::$line"
            done
          fi
          exit "$code"
      - name: Verify APK and record SHA-256
        working-directory: android
        run: |
          apk="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$apk"
          stat --printf='APK size: %s bytes\n' "$apk"
          sha256sum "$apk"
          echo "::notice::APK size: $(stat --printf='%s' "$apk") bytes"
          echo "::notice::APK SHA-256: $(sha256sum "$apk" | cut -d' ' -f1)"
      - name: Publish downloadable debug APK
        env:
          GH_TOKEN: ${{ github.token }}
        working-directory: android
        run: |
          tag="titan-debug-${{ github.run_number }}"
          gh release create "$tag" "app/build/outputs/apk/debug/app-debug.apk#titan-omega-v0.1.0-debug.apk" \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "TITAN OMEGA debug APK #${{ github.run_number }}" \
            --notes "Compiled from ${{ github.sha }}. Debug build; device installation and launch are not yet verified."

      - uses: actions/upload-artifact@v4
        with:
          name: titan-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
